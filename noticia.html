<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#2c3091">
  <meta name="description" content="Notícias oficiais da SBAtletismo">
  <title>Notícia | SBAtletismo</title>
  <link rel="icon" href="assets/logo-sbatletismo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .article-page{background:#f6f9fc;min-height:70vh;padding:54px 0 90px}
    .article-shell{max-width:900px;margin:auto}
    .article-back{display:inline-flex;align-items:center;gap:7px;color:#2c3091;font-size:.72rem;font-weight:900;margin-bottom:22px}
    .article-card{background:#fff;border:1px solid #e1e7ef;border-radius:24px;overflow:hidden;box-shadow:0 18px 52px rgba(22,34,79,.08)}
    .article-cover{width:100%;max-height:520px;object-fit:cover;display:none;background:#eaf0f6}
    .article-inner{padding:clamp(24px,5vw,54px)}
    .article-kicker{display:inline-block;color:#0798d2;font-size:.62rem;font-weight:900;letter-spacing:.12em;margin-bottom:10px}
    .article-title{font-family:Manrope,sans-serif;color:#1f286f;font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;margin:0 0 15px}
    .article-meta{color:#818999;font-size:.72rem;margin-bottom:24px}
    .article-excerpt{font-size:1.06rem;line-height:1.7;color:#4f5969;font-weight:600;border-left:4px solid #0798d2;padding-left:18px;margin:0 0 30px}
    .article-body{white-space:pre-line;color:#384354;line-height:1.85;font-size:.93rem}
    .article-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:34px;padding-top:24px;border-top:1px solid #e7ebf1}
    .article-error{padding:60px 24px;text-align:center}
    .article-error h1{font-family:Manrope,sans-serif;color:#1f286f}
    .article-loading{padding:70px 24px;text-align:center;color:#737d8d}
    @media(max-width:650px){.article-page{padding-top:28px}.article-card{border-radius:18px}.article-inner{padding:24px 19px}.article-actions .btn{width:100%}}
  </style>
</head>
<body>
  <div class="utility-bar"><div class="container utility-inner"><span>Associação SBAtletismo • Santa Bárbara d'Oeste – SP</span><div class="utility-actions"><a href="transparencia">Portal da Transparência</a></div></div></div>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/"><img id="article-logo" src="assets/logo-sbatletismo.svg" alt="Logo SBAtletismo"><div class="brand-copy"><strong>SBATLETISMO</strong><span>Santa Bárbara d'Oeste</span></div></a>
      <nav class="main-nav" style="display:flex"><a href="/">Início</a><a href="/#noticias">Notícias</a><a class="nav-highlight" href="transparencia">Transparência</a></nav>
    </div>
  </header>

  <main class="article-page">
    <div class="container article-shell">
      <a class="article-back" href="/#noticias">← Voltar para notícias</a>
      <article class="article-card" id="article-card">
        <div class="article-loading" id="article-loading">Carregando notícia...</div>
        <img class="article-cover" id="article-cover" alt="">
        <div class="article-inner" id="article-content" hidden>
          <span class="article-kicker">NOTÍCIA • SBATLETISMO</span>
          <h1 class="article-title" id="article-title"></h1>
          <div class="article-meta" id="article-meta"></div>
          <p class="article-excerpt" id="article-excerpt" hidden></p>
          <div class="article-body" id="article-body"></div>
          <div class="article-actions">
            <button class="btn btn-primary" id="share-news" type="button">Compartilhar notícia</button>
            <a class="btn btn-ghost" style="color:#2c3091;border-color:#ccd5e3" href="/#noticias">Voltar ao site</a>
          </div>
        </div>
      </article>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom"><span>© <span id="year"></span> SBAtletismo.</span><a href="/">Página inicial</a></div>
  </footer>

  <script type="module" src="noticia.js"></script>
</body>
</html>
